<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light dark">
  <title>教材学习室 · 输入访问码</title>
  <style>
    :root{color-scheme:light dark;--bg:#f6f4ed;--card:#fffdf8;--ink:#253f37;--muted:#65756e;--line:#d9dfd5;--accent:#315b4b;--error:#a33131}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;line-height:1.7}
    main{min-height:100svh;display:grid;place-items:center;padding:32px 20px}.card{width:min(100%,440px);padding:36px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 18px 60px #233b2e0a}
    .eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted)}h1{font-size:30px;font-weight:600;line-height:1.3;margin:16px 0}p{margin:12px 0}.intro,.foot{color:var(--muted);font-size:14px}
    form{margin-top:28px}label[for=access-code]{display:block;font-weight:600;margin-bottom:8px}.input-row{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
    input[type=password],input[type=text]{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;padding:13px 14px;background:transparent;color:var(--ink);border:0;outline:none}.input-row:focus-within{outline:2px solid var(--accent);outline-offset:2px}
    button{font:inherit;cursor:pointer}#show-code{border:0;background:transparent;color:var(--accent);padding:10px 14px;white-space:nowrap}.remember{display:flex;gap:8px;align-items:center;font-size:14px;margin:16px 0}input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
    #enter{width:100%;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:13px;font-weight:600}button:disabled{opacity:.65;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    #access-error{color:var(--error);font-size:14px;min-height:24px;margin-bottom:8px}.foot{margin:22px 0 0}a{color:var(--accent)}[hidden]{display:none!important}.loading{color:var(--muted);font-size:14px}
    @media(prefers-color-scheme:dark){:root{--bg:#19221e;--card:#212d26;--ink:#edf0e6;--muted:#b0bcaf;--line:#455649;--accent:#84b79d;--error:#ffb4ab}#enter{color:#13251b}}
    @media(max-width:420px){.card{padding:28px 22px}h1{font-size:27px}}
  </style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="access-title">
    <div class="eyebrow">法语，一点点 ／ 教材学习室</div>
    <h1 id="access-title">带上访问码，<br>开始今天的学习。</h1>
    <p class="intro">输入你收到的访问码，即可进入教材学习室。无需注册账号。</p>
    <p id="loading" class="loading" role="status">正在准备学习室…</p>
    <form id="access-form" hidden>
      <label for="access-code">访问码</label>
      <div class="input-row">
        <input id="access-code" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="access-error">
        <button id="show-code" type="button" aria-label="显示访问码" aria-pressed="false">显示</button>
      </div>
      <label class="remember"><input id="remember-device" type="checkbox">记住此设备 7 天</label>
      <p id="access-error" role="alert" aria-live="polite"></p>
      <button id="enter" type="submit">进入学习室</button>
    </form>
    <noscript><p>解锁学习室需要 JavaScript，请在浏览器中启用后刷新。</p></noscript>
    <p class="foot">还没有访问码？请联系分享此页面给你的人。<br><a href="../">返回公开学习库 →</a></p>
  </section>
</main>
<script>
  const initiator = /*[|js_staticrypt|]*/ 0;
  const config = /*[|staticrypt_config|]*/ 0;
  const access = initiator.init(config, {
    rememberExpirationKey: 'textbooks.access.expiration',
    rememberPassphraseKey: 'textbooks.access.passphrase',
    replaceHtmlCallback(html) { document.open(); document.write(html); document.close(); },
    clearLocalStorageCallback() {
      try { localStorage.removeItem('textbooks.access.expiration'); localStorage.removeItem('textbooks.access.passphrase'); } catch (_) {}
    }
  });
  const form = document.querySelector('#access-form');
  const field = document.querySelector('#access-code');
  const error = document.querySelector('#access-error');
  const enter = document.querySelector('#enter');
  const remember = document.querySelector('#remember-device');
  let storageAvailable = true;
  try { localStorage.getItem('textbooks.access.expiration'); } catch (_) {
    storageAvailable = false; remember.disabled = true;
  }
  document.querySelector('#show-code').addEventListener('click', function () {
    const show = field.type === 'password'; field.type = show ? 'text' : 'password';
    this.textContent = show ? '隐藏' : '显示';
    this.setAttribute('aria-label', show ? '隐藏访问码' : '显示访问码');
    this.setAttribute('aria-pressed', String(show));
  });
  form.addEventListener('submit', async function (event) {
    event.preventDefault(); enter.disabled = true; enter.textContent = '正在解锁…'; error.textContent = '';
    try {
      const result = await access.handleDecryptionOfPage(field.value.trim(), storageAvailable && remember.checked);
      if (result.isSuccessful) return;
      error.textContent = '访问码不正确，请检查后重试。'; field.setAttribute('aria-invalid','true'); field.focus();
    } catch (_) {
      error.textContent = '暂时无法解锁，请使用新版浏览器通过 HTTPS 打开后重试。';
    }
    enter.disabled = false; enter.textContent = '进入学习室';
  });
  (async function () {
    if (!window.crypto || !window.crypto.subtle) {
      document.querySelector('#loading').textContent = '请使用新版浏览器，通过 HTTPS 打开此页面。'; return;
    }
    try {
      if (storageAvailable && (await access.handleDecryptOnLoad()).isSuccessful) return;
    } catch (_) { /* Storage restrictions must not prevent manual decryption. */ }
    document.querySelector('#loading').hidden = true; form.hidden = false;
  })();
</script>
</body>
</html>
